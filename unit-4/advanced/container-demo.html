<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Query Demo</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="container-demo.css">
</head>
<body class="container-page">
    <header class="demo-header">
        <h1>Container Query Demo</h1>
        <p>See how the same card changes based on the space it has.</p>
    </header>

    <main class="demo-layout">
        <section class="demo-placement demo-placement--narrow">
            <h2>Sidebar placement</h2>
            <article class="feature-card">
                <img src="../grid-layouts/images/article-1.jpg" alt="">
                <div class="feature-card-content">
                    <h3>Evening in Idaho</h3>
                    <p>A little color in the sky before the sun went down.</p>
                </div>
            </article>
        </section>

        <section class="demo-placement demo-placement--wide">
            <h2>Main content placement</h2>
            <article class="feature-card">
                <img src="../grid-layouts/images/article-1.jpg" alt="">
                <div class="feature-card-content">
                    <h3>Evening in Idaho</h3>
                    <p>A little color in the sky before the sun went down.</p>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
